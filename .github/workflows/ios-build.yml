name: iOS Build & Test CI

# Author: Avinash Chavda
# Project: PeachChat - Real-Time iOS Messaging Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Verify iOS App
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode 16 Toolchain
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          fi
          sudo xcodebuild -license accept
          sudo xcodebuild -runFirstLaunch
          xcodebuild -version

      - name: Inspect Available Destinations
        run: |
          echo "### Available Destinations" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          xcodebuild -project ChatApp-main.xcodeproj -scheme ChatApp-main -showdestinations >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ChatApp-main.xcodeproj \
            -scheme ChatApp-main

      - name: Build PeachChat
        run: |
          set -o pipefail
          xcodebuild \
            -project ChatApp-main.xcodeproj \
            -scheme ChatApp-main \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      - name: Diagnostic Output
        if: always()
        run: |
          echo "### Xcodebuild Log (Tail)" >> $GITHUB_STEP_SUMMARY
          if [ -f xcodebuild.log ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 xcodebuild.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No xcodebuild.log file was generated." >> $GITHUB_STEP_SUMMARY
          fi
