name: iOS Build & Test CI

# Author: Avinash Chavda
# Project: PeachChat - Real-Time iOS Messaging Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Verify iOS App
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode 16 Toolchain
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          fi
          sudo xcodebuild -license accept
          sudo xcodebuild -runFirstLaunch
          xcodebuild -version

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ChatApp-main.xcodeproj \
            -scheme ChatApp-main

      - name: Build PeachChat (iOS Simulator)
        run: |
          xcodebuild \
            -project ChatApp-main.xcodeproj \
            -scheme ChatApp-main \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcodebuild.log || {
              echo "=== BUILD FAILED. RELEVANT ERRORS: ==="
              grep -C 3 -E "(error:|fatal error:|BUILD FAILED)" xcodebuild.log || tail -n 100 xcodebuild.log
              exit 1
            }
