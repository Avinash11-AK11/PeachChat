name: iOS Build & Test CI

# Author: Avinash Chavda
# Project: PeachChat - Real-Time iOS Messaging Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Verify iOS App
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Xcode 16
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true
          
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          fi
          
          xcodebuild -version

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ChatApp-main.xcodeproj \
            -scheme ChatApp-main

      - name: Build PeachChat (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project ChatApp-main.xcodeproj \
            -scheme ChatApp-main \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
